name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-ci:
    name: Go Build & Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: implementations/go

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whoknows_test
          POSTGRES_USER: whoknows
          POSTGRES_PASSWORD: whoknows
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://whoknows:whoknows@localhost:5432/whoknows_test?sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Install dependencies
        run: go mod download all
      - name: Verify dependencies
        run: go mod verify
      - name: Run go vet
        run: go vet ./backend/...
      - name: Run go fmt check
        run: |
          if [ "$(gofmt -s -l backend | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run 'gofmt -s -w backend'"
            gofmt -s -l backend
            exit 1
          fi
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.0
          working-directory: implementations/go
          args: --timeout=5m ./backend/...
      - name: Build Go application
        run: go build -v -o whoknows-server ./backend/...
      - name: Run Go tests
        run: go test -v -race -coverprofile=coverage.out ./backend/...
      - name: Display Go test coverage
        if: success()
        run: go tool cover -func=coverage.out

  database-validation:
    name: Database Schema Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whoknows_test
          POSTGRES_USER: whoknows
          POSTGRES_PASSWORD: whoknows
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Validate PostgreSQL schema
        run: |
          if [ -f implementations/go/schema.sql ]; then
            echo "✅ Schema file exists"
            PGPASSWORD=whoknows psql -h localhost -U whoknows -d whoknows_test -f implementations/go/schema.sql
            echo "✅ Schema is valid SQL"
          else
            echo "⚠️ No schema.sql found"
          fi

  weather-smoke-test:
    name: Weather Endpoint Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [go-ci]
    defaults:
      run:
        working-directory: implementations/go
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: whoknows_test
          POSTGRES_USER: whoknows
          POSTGRES_PASSWORD: whoknows
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://whoknows:whoknows@localhost:5432/whoknows_test?sslmode=disable
      SECRET_KEY: test-secret-key-for-ci
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: false
      - name: Apply schema
        run: |
          PGPASSWORD=whoknows psql -h localhost -U whoknows -d whoknows_test -f schema.sql
      - name: Build and start server
        run: |
          go build -o whoknows-server ./backend/...
          ./whoknows-server &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/health && break
            sleep 2
          done
      - name: Smoke test /weather
        run: |
          curl -sf http://localhost:8080/weather
          curl -sf "http://localhost:8080/weather?city=Copenhagen"


  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [go-ci, database-validation, weather-smoke-test]
    steps:
      - name: All checks passed
        run: |
          echo "All CI checks passed!"
          echo "✅ Go build successful"
          echo "✅ Code quality verified"
          echo "✅ Database schema valid"
          echo "✅ Weather endpoint smoke test passed"
          echo "Ready to merge!"