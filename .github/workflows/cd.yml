name: CD Deploy to VM

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set image name
        id: vars
        run: |
          OWNER_LC=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LC}/whoknows-go" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: implementations/go/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.image_name }}:latest
            ${{ steps.vars.outputs.image_name }}:${{ github.sha }}

  trivy-scan:
    name: Scan Docker Image (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    needs: build-and-push

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ needs.build-and-push.outputs.image_name }}:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy on VM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build-and-push

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Copy production compose and scripts to VM
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml,implementations/go/scripts/deploy_compose.sh
          target: /opt/whoknows-deploy
          overwrite: true

      - name: Deploy with Docker Compose on VM
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            sudo mkdir -p /opt/whoknows
            sudo mkdir -p /opt/whoknows/implementations/go/scripts

            sudo cp -f /opt/whoknows-deploy/docker-compose.prod.yml /opt/whoknows/docker-compose.prod.yml
            sudo cp -f /opt/whoknows-deploy/implementations/go/scripts/deploy_compose.sh /opt/whoknows/implementations/go/scripts/deploy_compose.sh

            cd /opt/whoknows
            sudo mv -f docker-compose.prod.yml docker-compose.yml

            sudo chmod +x /opt/whoknows/implementations/go/scripts/deploy_compose.sh

            export GHCR_USER="${{ secrets.GHCR_USER }}"
            export GHCR_PAT="${{ secrets.GHCR_PAT }}"

            bash /opt/whoknows/implementations/go/scripts/deploy_compose.sh \
              "${{ needs.build-and-push.outputs.image_name }}" \
              "${{ github.sha }}"
            echo "=== Restarting nginx to refresh DNS ==="
            sudo docker restart tls-nginx-1
            sudo docker image prune -f
