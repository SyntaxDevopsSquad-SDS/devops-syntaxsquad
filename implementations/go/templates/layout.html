{{ define "layout" }}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Who Knows?</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❓</text></svg>">
    <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body>
<div class="page">
    <div class="navigation">
        <nav>
            <h1><a id="nav-logo" href="/search">¿Who Knows?</a></h1>
            <div class="nav-right">
                {{ if .User }}
                    <a id="nav-logout" href="#" onclick="logoutUser(); return false;">Log out [{{ .User }}]</a>
                {{ else }}
                    <a id="nav-login" href="/login">Log in</a>
                    <a id="nav-register" href="/register">Register</a>
                {{ end }}
                <a id="nav-weather" href="/weather">Weather</a>
            </div>
        </nav>
    </div>
    {{ if .Flash }}
        <ul class="flashes">
            <li>{{ .Flash }}</li>
        </ul>
    {{ end }}
    <div class="body">
        {{ template "content" . }}
    </div>
    <div class="footer">
        <span>¿Who Knows? &copy; 2009</span>
        <a href="/about">About</a>
    </div>
</div>
<script>
    function logoutUser() {
        fetch('/api/logout')
            .then(response => response.json())
            .then(data => {
                if (data.statusCode === 200) {
                    sessionStorage.setItem('flash', 'You were logged out successfully.');
                    window.location.href = '/';
                }
            });
    }

    document.addEventListener("DOMContentLoaded", function() {
        const toastMsg = sessionStorage.getItem('flash');
        if (toastMsg) {
            sessionStorage.removeItem('flash');
        }

        const path = window.location.pathname;
        const loginLink = document.getElementById("nav-login");
        const registerLink = document.getElementById("nav-register");
        const weatherLink = document.getElementById("nav-weather");

        if (weatherLink && path === "/weather") {
            weatherLink.classList.add("is-active");
            weatherLink.setAttribute("aria-current", "page");
        }

        const weatherLink = document.getElementById("nav-weather");

        if (weatherLink && path === "/weather") {
            weatherLink.classList.add("is-active");
            weatherLink.setAttribute("aria-current", "page");
        }

        if (loginLink && path === "/login") {
            loginLink.classList.add("is-active");
            loginLink.setAttribute("aria-current", "page");
        }

        if (registerLink && path === "/register") {
            registerLink.classList.add("is-active");
            registerLink.setAttribute("aria-current", "page");
        }
    });
</script>
</body>
</html>
{{ end }}
